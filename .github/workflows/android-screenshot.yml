name: Android Build and Screen Proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install screenshot validator
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Build app and UI test
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Launch the real app and capture every screen
        id: visual_test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p proof/screenshots proof/reports
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            adb shell input keyevent 82
            adb logcat -c
            set +e
            gradle :app:connectedDebugAndroidTest --stacktrace
            TEST_STATUS=$?
            set -e
            adb pull /sdcard/Android/data/com.mr131.redplayer/files/Pictures/screenshots proof/screenshots || true
            cp -R app/build/reports/androidTests proof/reports/ || true
            adb shell uiautomator dump /sdcard/current-window.xml || true
            adb pull /sdcard/current-window.xml proof/ || true
            adb logcat -d -v threadtime > proof/logcat.txt
            adb shell dumpsys activity activities > proof/activities.txt
            set +e
            python tools/validate_screenshots.py proof/screenshots --required \
              01-home.png 02-settings.png 03-more-menu.png 04-search.png \
              05-playback-speed.png 06-system-video-picker.png
            VALIDATION_STATUS=$?
            set -e
            if grep -Eq 'FATAL EXCEPTION.*com\.mr131\.redplayer|ANR in com\.mr131\.redplayer' proof/logcat.txt; then
              echo 'Red Player crashed or stopped responding' >&2
              exit 20
            fi
            test "$TEST_STATUS" -eq 0
            test "$VALIDATION_STATUS" -eq 0
      - name: Upload APK, screenshots, UI tree, logs, and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-screenshots-and-logs
          path: |
            app/build/outputs/apk/debug/*.apk
            proof/
          if-no-files-found: error
      - name: Fail an unsuccessful visual test
        if: steps.visual_test.outcome == 'failure'
        run: exit 1
