name: Android Build and Screen Proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install screenshot validator
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Build app and UI test
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Launch the real app and capture every screen
        id: visual_test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash tools/run_visual_test.sh
      - name: Upload APK, screenshots, UI tree, logs, and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-screenshots-and-logs
          path: |
            app/build/outputs/apk/debug/*.apk
            proof/
          if-no-files-found: error
      - name: Fail an unsuccessful visual test
        if: steps.visual_test.outcome == 'failure'
        run: exit 1
