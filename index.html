<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a90000"><title>131 Red Player</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--r:#e1121d;--d:#8b0008;--b:#070708;--p:#151517;--l:#3b3b40;--m:#b9b9bf}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}body{background:radial-gradient(circle at 50% -20%,#650007,#150003 35%,#050506 75%);min-height:100dvh}
button,select,input{font:inherit}button,select{color:#fff;background:#242429;border:1px solid #4a4a50;border-radius:12px;min-height:44px;padding:8px 12px;font-weight:800}button:active{transform:scale(.96)}
.primary{background:linear-gradient(#f32431,#a30009);border-color:#ff6970;box-shadow:0 0 17px #e1121d66}.active{background:var(--r)!important}.app{width:min(100%,1000px);margin:auto;padding:10px 10px calc(15px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:5px 2px 12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#ff2430,#8d0007);box-shadow:0 0 20px #e1121d88;font-weight:1000}.brand h1{font-size:20px;margin:0}.brand small{color:#ff8b91}
.shell{overflow:hidden;border:1px solid #641b21;border-radius:18px;background:#000;box-shadow:0 15px 45px #000a}.stage{aspect-ratio:16/9;position:relative;display:grid;place-items:center;background:#000;overflow:hidden}.stage video{width:100%;height:100%;object-fit:contain}.empty{position:absolute;text-align:center;color:var(--m)}.empty strong{display:block;color:#fff;font-size:20px}.mark{font-size:55px;color:var(--r);filter:drop-shadow(0 0 14px #d00)}
.badges{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;pointer-events:none}.badge{background:#000c;border:1px solid #ffffff25;border-radius:9px;padding:5px 8px;font-size:11px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.unlock{position:absolute;inset:0;display:none;place-items:center}.locked .unlock{display:grid}.locked .controls{visibility:hidden}
.controls{padding:10px;background:linear-gradient(#19191c,#0d0d0f)}.seek{display:grid;grid-template-columns:42px 1fr 42px;gap:7px;align-items:center;color:var(--m);font-size:12px}input[type=range]{accent-color:var(--r);width:100%}
.main{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:8px}.main button{min-width:42px;padding:7px}.play{width:56px;height:56px;border-radius:50%;font-size:20px}.vol{display:flex;align-items:center;gap:5px;flex:1;max-width:170px}.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.tools button,.tools select{min-width:0;font-size:12px;padding:6px 4px}
.library{margin-top:12px;background:#111114;border:1px solid #35353a;border-radius:16px;overflow:hidden}.libhead{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid #2d2d32}.libhead h2{font-size:16px;margin:0}.pick{display:flex;gap:6px}.pick button{min-height:36px;font-size:12px}.searchbar{display:grid;grid-template-columns:1fr auto auto;gap:7px;padding:9px 11px;border-bottom:1px solid #29292e}.searchbar input{min-width:0;background:#080809;color:#fff;border:1px solid #3c3c42;border-radius:11px;padding:10px}.searchbar button{min-height:39px;padding:6px 10px}.favorite{color:#ff4c56!important}.settings{display:none;margin-top:12px;padding:12px;background:#111114;border:1px solid #35353a;border-radius:16px}.settings.open{display:block}.settings h2{font-size:16px;margin:0 0 10px}.settinggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.settinggrid label{color:var(--m);font-size:12px}.settinggrid select,.settinggrid button{display:block;width:100%;margin-top:5px}.sleep{color:#ff9ba0;font-size:12px;margin-top:8px}
.list{max-height:260px;overflow:auto}.item{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:9px 11px;border-bottom:1px solid #27272b}.thumb{width:42px;height:42px;border-radius:10px;background:linear-gradient(145deg,#490006,#111);display:grid;place-items:center;color:#ff555d}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.item small,.emptylist{color:var(--m)}.item button{min-height:34px;padding:5px 9px}.emptylist{text-align:center;padding:25px}.notice{text-align:center;color:#ff9ba0;min-height:30px;padding:8px}.hidden{display:none}
@media(max-width:620px){.brand h1{font-size:18px}.tools{grid-template-columns:repeat(3,1fr)}.main{gap:2px}.main button{font-size:12px;min-width:38px}.vol{max-width:105px}.libhead{align-items:flex-start;flex-direction:column;gap:8px}.pick{width:100%}.pick button{flex:1}.settinggrid{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr auto}.searchbar #sort{grid-column:1/-1}}
</style></head><body><main class="app">
<header><div class="brand"><div class="logo">131</div><div><h1>131 RED PLAYER</h1><small>Private • Offline • No ads</small></div></div><button id="install" class="hidden">Install</button></header>
<section class="shell" id="shell"><div class="stage" id="stage"><video id="video" playsinline preload="metadata"></video>
<div class="empty" id="empty"><div class="mark">▶</div><strong>Choose a video</strong>Files stay on your device.</div>
<div class="badges"><span class="badge" id="name">131 RED PLAYER</span><span class="badge" id="abstate">A–B OFF</span></div>
<div class="unlock" id="unlock"><button class="primary">🔒 Hold to unlock</button></div></div>
<div class="controls"><div class="seek"><span id="now">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="length">0:00</span></div>
<div class="main"><button id="back">−10</button><button id="play" class="play primary">▶</button><button id="next">+10</button><div class="vol">🔊<input id="volume" type="range" min="0" max="1" step=".05" value="1"></div><button id="rotate">↻</button><button id="full">⛶</button></div>
<div class="tools"><select id="speed"><option>.25×</option><option>.5×</option><option>.75×</option><option selected>1×</option><option>1.25×</option><option>1.5×</option><option>1.75×</option><option>2×</option><option>3×</option></select><button id="ab">A–B</button><button id="pip">Mini player</button><button id="subs">Subtitles</button><button id="lock">Lock</button><button id="fit">Fit: Inside</button><button id="repeat">Repeat: Off</button><button id="shuffle">Shuffle: Off</button><button id="settingsBtn">Settings</button></div></div></section>
<div class="notice" id="notice"></div>
<section class="settings" id="settings"><h2>Player settings</h2><div class="settinggrid"><label>Skip amount<select id="skip"><option value="5">5 seconds</option><option value="10" selected>10 seconds</option><option value="15">15 seconds</option><option value="30">30 seconds</option></select></label><label>Sleep timer<select id="sleep"><option value="0">Off</option><option value="15">15 minutes</option><option value="30">30 minutes</option><option value="60">1 hour</option><option value="120">2 hours</option></select></label><label>Keep screen awake<button id="awake">Screen awake: Off</button></label></div><div class="sleep" id="sleepstate">Sleep timer is off.</div></section>
<section class="library"><div class="libhead"><h2>My videos <small id="count"></small></h2><div class="pick"><button id="add" class="primary">＋ Add videos</button><button id="folder">📁 Add folder</button></div></div><div class="searchbar"><input id="search" placeholder="Search videos" aria-label="Search videos"><button id="favorites">☆ Favorites</button><select id="sort" aria-label="Sort videos"><option value="added">Recently added</option><option value="az">Name A–Z</option><option value="za">Name Z–A</option><option value="size">Largest first</option></select></div><div class="list" id="list"><div class="emptylist">Your playlist will appear here.</div></div></section>
<input id="files" type="file" accept="video/*,.mkv,.avi" multiple hidden><input id="folders" type="file" accept="video/*,.mkv,.avi" webkitdirectory multiple hidden><input id="subfile" type="file" accept=".vtt,text/vtt" hidden>
</main><script>
(()=>{
const $=x=>document.getElementById(x),v=$('video'),shell=$('shell'),seek=$('seek');
let items=[],at=-1,url='',a=null,b=null,installEvent,unlockTimer,sleepTimer,wakeLock;
let repeat='off',shuffle=false,fit=0,favoritesOnly=false;
const fits=['contain','cover','fill'],fitNames=['Inside','Fill screen','Stretch'];
const time=n=>{if(!Number.isFinite(n))return'0:00';n=Math.max(0,Math.floor(n));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
function say(s){$('notice').textContent=s;clearTimeout(say.t);say.t=setTimeout(()=>$('notice').textContent='',2800)}
function save(){if(at>=0&&Number.isFinite(v.currentTime))localStorage.setItem('red:'+items[at].key,v.currentTime)}
function favoriteSet(){try{return new Set(JSON.parse(localStorage.getItem('red:favorites')||'[]'))}catch{return new Set()}}
function shown(){
  let q=$('search').value.trim().toLowerCase(),fav=favoriteSet(),list=items.map((x,i)=>({...x,i}));
  if(q)list=list.filter(x=>x.file.name.toLowerCase().includes(q));
  if(favoritesOnly)list=list.filter(x=>fav.has(x.key));
  if($('sort').value==='az')list.sort((x,y)=>x.file.name.localeCompare(y.file.name));
  if($('sort').value==='za')list.sort((x,y)=>y.file.name.localeCompare(x.file.name));
  if($('sort').value==='size')list.sort((x,y)=>y.file.size-x.file.size);
  return list;
}
function render(){
  const out=$('list'),fav=favoriteSet(),list=shown();$('count').textContent=items.length?'('+items.length+')':'';
  if(!list.length){out.innerHTML='<div class="emptylist">'+(items.length?'No matching videos.':'Your playlist will appear here.')+'</div>';return}
  out.innerHTML='';
  list.forEach(x=>{let row=document.createElement('div');row.className='item';row.innerHTML='<button class="thumb" aria-label="Favorite">'+(fav.has(x.key)?'★':'☆')+'</button><div><b></b><small></small></div><button>'+(x.i===at?'Playing':'Play')+'</button>';row.querySelector('b').textContent=x.file.name;row.querySelector('small').textContent=x.size;row.querySelectorAll('button')[0].classList.toggle('favorite',fav.has(x.key));row.querySelectorAll('button')[0].onclick=()=>toggleFavorite(x.key);row.querySelectorAll('button')[1].onclick=()=>load(x.i,true);out.appendChild(row)})
}
function toggleFavorite(key){let fav=favoriteSet();fav.has(key)?fav.delete(key):fav.add(key);localStorage.setItem('red:favorites',JSON.stringify([...fav]));render()}
function add(files){
  let known=new Set(items.map(x=>x.key)),valid=[...files].filter(f=>f.type.startsWith('video/')||/\.(mp4|mov|mkv|avi|webm|m4v)$/i.test(f.name));
  valid.forEach(file=>{let key=file.name+':'+file.size+':'+file.lastModified;if(!known.has(key)){items.push({file,key,size:(file.size/1048576).toFixed(1)+' MB'});known.add(key)}});
  render();if(at<0&&items.length)load(0,false);say(valid.length+' video'+(valid.length===1?'':'s')+' added')
}
function updateMedia(){
  if(!('mediaSession'in navigator)||at<0)return;
  navigator.mediaSession.metadata=new MediaMetadata({title:items[at].file.name,artist:'131 Red Player',album:'Local video'});
}
function load(i,auto){
  if(!items[i])return;save();if(url)URL.revokeObjectURL(url);at=i;url=URL.createObjectURL(items[i].file);v.src=url;$('empty').classList.add('hidden');$('name').textContent=items[i].file.name;updateMedia();
  v.onloadedmetadata=()=>{let old=Number(localStorage.getItem('red:'+items[i].key)||0);if(old>0&&old<v.duration-5){v.currentTime=old;say('Resumed at '+time(old))}if(auto)v.play().catch(()=>{})};render()
}
function toggle(){if(!v.src)return say('Add a video first');v.paused?v.play():v.pause()}
function jump(amount){if(v.src)v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+amount))}
function nextVideo(direction=1){
  if(!items.length)return;if(shuffle&&items.length>1){let i;do{i=Math.floor(Math.random()*items.length)}while(i===at);return load(i,true)}
  let i=at+direction;if(i>=items.length)i=repeat==='all'?0:at;if(i<0)i=repeat==='all'?items.length-1:0;if(i!==at)load(i,true)
}
v.onplay=()=>$('play').textContent='❚❚';v.onpause=()=>{$('play').textContent='▶';save()};
v.ontimeupdate=()=>{seek.value=v.duration?Math.round(v.currentTime/v.duration*1000):0;$('now').textContent=time(v.currentTime);if(b!==null&&v.currentTime>=b)v.currentTime=a;if('mediaSession'in navigator&&v.duration)try{navigator.mediaSession.setPositionState({duration:v.duration,playbackRate:v.playbackRate,position:Math.min(v.currentTime,v.duration)})}catch{}};
v.ondurationchange=()=>$('length').textContent=time(v.duration);v.onended=()=>{save();if(repeat==='one'){v.currentTime=0;v.play()}else nextVideo(1)};v.onerror=()=>say('This video format is not supported here.');window.onbeforeunload=save;
$('play').onclick=toggle;$('stage').onclick=e=>{if(e.target===v)toggle()};$('back').onclick=()=>jump(-Number($('skip').value));$('next').onclick=()=>jump(Number($('skip').value));seek.oninput=()=>{if(v.duration)v.currentTime=seek.value/1000*v.duration};$('volume').oninput=e=>v.volume=e.target.value;$('speed').onchange=e=>{v.playbackRate=parseFloat(e.target.value);say('Speed '+e.target.value)};
$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():shell.requestFullscreen?.().catch(()=>say('Fullscreen is unavailable'));
$('rotate').onclick=async()=>{try{await screen.orientation.lock(screen.orientation.type.startsWith('landscape')?'portrait':'landscape');say('Screen rotated')}catch{say('Use your phone rotation button')}};
$('pip').onclick=async()=>{try{document.pictureInPictureElement?await document.exitPictureInPicture():await v.requestPictureInPicture()}catch{say('Mini player is unavailable')}};
$('ab').onclick=()=>{if(!v.src)return say('Add a video first');if(a===null){a=v.currentTime;$('ab').classList.add('active');$('abstate').textContent='SET B';say('Point A saved')}else if(b===null){b=Math.max(v.currentTime,a+.2);$('abstate').textContent=time(a)+'–'+time(b);say('A–B repeat is on')}else{a=b=null;$('ab').classList.remove('active');$('abstate').textContent='A–B OFF';say('A–B repeat is off')}};
$('fit').onclick=()=>{fit=(fit+1)%fits.length;v.style.objectFit=fits[fit];$('fit').textContent='Fit: '+fitNames[fit];say(fitNames[fit]+' view')};
$('repeat').onclick=()=>{repeat=repeat==='off'?'all':repeat==='all'?'one':'off';$('repeat').textContent='Repeat: '+(repeat==='all'?'All':repeat==='one'?'One':'Off');$('repeat').classList.toggle('active',repeat!=='off')};
$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').textContent='Shuffle: '+(shuffle?'On':'Off');$('shuffle').classList.toggle('active',shuffle)};
$('subs').onclick=()=>$('subfile').click();$('subfile').onchange=e=>{let f=e.target.files[0];if(!f)return;v.querySelectorAll('track').forEach(x=>x.remove());let t=document.createElement('track');t.kind='subtitles';t.label=f.name;t.srclang='en';t.src=URL.createObjectURL(f);t.default=true;v.appendChild(t);say('Subtitles loaded')};
$('lock').onclick=()=>{shell.classList.add('locked');say('Controls locked')};$('unlock').onpointerdown=()=>unlockTimer=setTimeout(()=>{shell.classList.remove('locked');say('Controls unlocked')},900);$('unlock').onpointerup=$('unlock').onpointercancel=()=>clearTimeout(unlockTimer);
$('settingsBtn').onclick=()=>$('settings').classList.toggle('open');
$('sleep').onchange=e=>{clearTimeout(sleepTimer);let mins=Number(e.target.value);$('sleepstate').textContent=mins?'Player will pause in '+mins+' minutes.':'Sleep timer is off.';if(mins)sleepTimer=setTimeout(()=>{v.pause();say('Sleep timer paused the video');e.target.value='0';$('sleepstate').textContent='Sleep timer is off.'},mins*60000)};
$('awake').onclick=async()=>{try{if(wakeLock){await wakeLock.release();wakeLock=null}else wakeLock=await navigator.wakeLock.request('screen');$('awake').textContent='Screen awake: '+(wakeLock?'On':'Off');$('awake').classList.toggle('active',!!wakeLock)}catch{say('Screen-awake mode is unavailable')}};
$('add').onclick=()=>$('files').click();$('files').onchange=e=>add(e.target.files);$('folder').onclick=()=>$('folders').click();$('folders').onchange=e=>add(e.target.files);
$('search').oninput=render;$('sort').onchange=render;$('favorites').onclick=()=>{favoritesOnly=!favoritesOnly;$('favorites').classList.toggle('active',favoritesOnly);$('favorites').textContent=favoritesOnly?'★ Favorites':'☆ Favorites';render()};
let touchX=0,touchY=0;$('stage').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});$('stage').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){jump(dx>0?Number($('skip').value):-Number($('skip').value));say((dx>0?'+':'−')+$('skip').value+' seconds')}},{passive:true});
if('mediaSession'in navigator){navigator.mediaSession.setActionHandler('play',()=>v.play());navigator.mediaSession.setActionHandler('pause',()=>v.pause());navigator.mediaSession.setActionHandler('seekbackward',d=>jump(-(d.seekOffset||10)));navigator.mediaSession.setActionHandler('seekforward',d=>jump(d.seekOffset||10));navigator.mediaSession.setActionHandler('previoustrack',()=>nextVideo(-1));navigator.mediaSession.setActionHandler('nexttrack',()=>nextVideo(1))}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;$('install').classList.remove('hidden')});$('install').onclick=async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null;$('install').classList.add('hidden')}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
